<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإعدادات — MyStudy</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="page-content">
  <div class="pagehead">
    <h1>الإعدادات</h1>
    <p>خصّص تجربتك داخل الموقع.</p>
  </div>

  <div class="simple-card">
    <div class="setting-row">
      <div class="t"><b>الوضع الليلي</b><span>مريح أكثر للعين أثناء المذاكرة الليلية</span></div>
      <div class="switch" id="darkSwitch"></div>
    </div>
    <div class="setting-row">
      <div class="t"><b>تذكيرات المذاكرة</b><span>تنبيه بمواعيد جدولك الدراسي (تجريبي)</span></div>
      <div class="switch" id="remindSwitch"></div>
    </div>
  </div>

  <div class="simple-card">
    <div class="setting-row">
      <div class="t"><b>إعادة ضبط التقدم</b><span>يمسح كل علامات الإنجاز، المفضلة، والملاحظات</span></div>
      <button id="resetBtn" style="background:#EF4444;color:#fff;padding:9px 16px;border-radius:10px;font-weight:700;font-size:13px">إعادة ضبط</button>
    </div>
  </div>

  <div class="simple-card" style="text-align:center;color:var(--ink-dim);font-size:12.5px">
    MyStudy © 2026 — صُنع لمساعدتك على التفوق 💜
  </div>
</div>

<script src="assets/app.js"></script>
<script src="assets/settings.js"></script>
</body>
</html>
