<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyStudy — موقعك الدراسي</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Cairo:wght@400;500;600;700&display=swap');

:root{
  --bg: #F3F2FA; --bg-soft:#FFFFFF; --ink:#201C33; --ink-dim:#6E6A85; --line:#E7E4F3; --card:#FFFFFF;
  --shadow: 0 10px 30px -14px rgba(45,32,90,.18);
  --chem:#7C3AED; --chem-dk:#5B21B6; --chem-lt:#EFE6FE;
  --eng:#2563EB;  --eng-dk:#1D4ED8;  --eng-lt:#E3ECFE;
  --comm:#C1873F; --comm-dk:#9C6A2C; --comm-lt:#FBEEDC;
  --med:#0E9CAE;  --med-dk:#0B7C8B;  --med-lt:#DFF6F8;
  --accent:var(--chem); --accent-dk:var(--chem-dk); --accent-lt:var(--chem-lt);
  --radius:18px; --radius-sm:12px;
}
[data-theme="dark"]{
  --bg:#14121F; --bg-soft:#1B1930; --ink:#F1EFFB; --ink-dim:#9C97B8; --line:#2B2745; --card:#1E1B34;
  --shadow: 0 10px 30px -14px rgba(0,0,0,.5);
  --chem-lt:#2B2145; --eng-lt:#1B2740; --comm-lt:#332617; --med-lt:#132E32;
}
body[data-section="chemistry"]{ --accent:var(--chem); --accent-dk:var(--chem-dk); --accent-lt:var(--chem-lt); }
body[data-section="english"]{ --accent:var(--eng); --accent-dk:var(--eng-dk); --accent-lt:var(--eng-lt); }
body[data-section="communication"]{ --accent:var(--comm); --accent-dk:var(--comm-dk); --accent-lt:var(--comm-lt); }
body[data-section="medical"]{ --accent:var(--med); --accent-dk:var(--med-dk); --accent-lt:var(--med-lt); }

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{ margin:0; direction:rtl; text-align:right; background:var(--bg); color:var(--ink); font-family:'Cairo',sans-serif; font-size:15px; line-height:1.7; transition:background .25s,color .25s; }
h1,h2,h3,h4{ font-family:'El Messiri',serif; font-weight:700; margin:0; color:var(--ink); }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; border:none; }
img,video{ max-width:100%; display:block; }
:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; }
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

.app{ display:grid; grid-template-columns:250px 1fr; min-height:100vh; }
.sidebar{ background:var(--bg-soft); border-left:1px solid var(--line); padding:22px 18px; position:sticky; top:0; height:100vh; overflow-y:auto; }
.brand{ display:flex; align-items:center; gap:10px; padding:6px 4px 22px; }
.brand .mark{ width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center; background:linear-gradient(135deg,var(--chem),var(--eng)); color:#fff; font-family:'El Messiri',serif; font-weight:700; font-size:18px; }
.brand .name{ font-family:'El Messiri',serif; font-weight:700; font-size:19px; }
.brand .tag{ font-size:11.5px; color:var(--ink-dim); }
.who{ display:flex; align-items:center; gap:10px; background:var(--accent-lt); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:18px; }
.who .avatar{ width:38px;height:38px;border-radius:50%; background:var(--accent); color:#fff; display:flex;align-items:center;justify-content:center; font-weight:700; }
.who .hi{ font-size:12px; color:var(--ink-dim); }
.who .uname{ font-weight:700; font-size:13.5px; }
nav.mainnav{ display:flex; flex-direction:column; gap:3px; }
nav.mainnav a{ display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:var(--radius-sm); color:var(--ink-dim); font-weight:600; font-size:14px; }
nav.mainnav a svg{ width:19px; height:19px; flex:none; }
nav.mainnav a:hover{ background:var(--bg); color:var(--ink); }
nav.mainnav a.active{ background:var(--accent); color:#fff; }
.nav-sep{ height:1px; background:var(--line); margin:14px 2px; }
.grow-card{ margin-top:20px; background:var(--bg); border:1px dashed var(--line); border-radius:var(--radius); padding:16px; text-align:center; font-size:13px; color:var(--ink-dim); }
.grow-card .leaf{ font-size:22px; margin-bottom:6px; }

.main{ padding:20px 26px 60px; min-width:0; }
.topbar{ display:flex; align-items:center; gap:14px; margin-bottom:18px; }
.search{ flex:1; display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:11px 18px; box-shadow:var(--shadow); }
.search input{ border:none; background:none; flex:1; font-family:inherit; font-size:14px; color:var(--ink); }
.search input:focus{ outline:none; }
.icon-btn{ width:42px;height:42px;border-radius:50%; background:var(--card); border:1px solid var(--line); display:flex;align-items:center;justify-content:center; box-shadow:var(--shadow); position:relative; flex:none; }
.icon-btn svg{ width:19px;height:19px; }
.dot{ position:absolute; top:9px; left:10px; width:7px;height:7px;border-radius:50%; background:#EF4444; }
.content-grid{ display:grid; grid-template-columns:1fr 320px; gap:22px; align-items:start; }
.rightcol{ display:flex; flex-direction:column; gap:18px; }

.hero{ border-radius:var(--radius); overflow:hidden; position:relative; min-height:190px; display:flex; align-items:center; padding:26px 30px; margin-bottom:22px; color:#fff;
  background:linear-gradient(120deg, rgba(20,15,40,.86), rgba(60,30,90,.55)), url('https://images.unsplash.com/photo-1497633762265-9d179a990aa6?q=80&w=1400&auto=format&fit=crop') center/cover; }
.hero .htext{ max-width:560px; }
.hero h1{ color:#fff; font-size:26px; margin-bottom:8px; }
.hero p{ margin:0; opacity:.92; font-size:14px; line-height:1.9;}

.cards4{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:26px; }
.scard{ background:var(--card); border-radius:var(--radius); padding:20px 18px; box-shadow:var(--shadow); border-top:4px solid var(--c); display:flex; flex-direction:column; gap:12px; position:relative; overflow:hidden; }
.scard .icon{ width:62px;height:62px;border-radius:50%; display:flex;align-items:center;justify-content:center; background:var(--c); color:#fff; font-size:26px; margin:0 auto; }
.scard h3{ text-align:center; font-size:18px; }
.scard .en{ text-align:center; font-size:12px; color:var(--ink-dim); margin-top:-8px; }
.scard .stats{ display:flex; justify-content:center; gap:14px; font-size:11.5px; color:var(--ink-dim); }
.scard .stats b{ display:block; color:var(--ink); font-size:13px; }
.scard .progress-row{ display:flex; align-items:center; gap:8px; font-size:11px; color:var(--ink-dim); }
.pbar{ flex:1; height:6px; border-radius:99px; background:var(--bg); overflow:hidden; }
.pbar > span{ display:block; height:100%; background:var(--c); border-radius:99px; }
.scard .enter{ margin-top:4px; background:var(--c); color:#fff; border-radius:11px; padding:11px; text-align:center; font-weight:700; font-size:13.5px; display:flex; align-items:center; justify-content:center; gap:6px; }

.widget{ background:var(--card); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); }
.widget h4{ font-size:14.5px; margin-bottom:12px; }
.tool-list a, .tool-list button.tool{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 10px; border-radius:var(--radius-sm); font-size:13.5px; font-weight:600; color:var(--ink); background:none; width:100%; text-align:right; }
.tool-list a:hover, .tool-list button.tool:hover{ background:var(--bg); }
.tool-list svg{ width:17px;height:17px; color:var(--ink-dim); }
.plan-item{ display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid var(--line); font-size:13px; }
.plan-item:last-of-type{ border-bottom:none; }
.plan-dot{ width:8px;height:8px;border-radius:50%; flex:none; }
.plan-item .t{ font-weight:700; }
.plan-item .time{ margin-inline-start:auto; color:var(--ink-dim); font-size:12px; }
.plan-cta{ margin-top:10px; width:100%; padding:10px; background:var(--bg); border-radius:var(--radius-sm); font-weight:700; font-size:13px; text-align:center; }
.quote-card{ background:linear-gradient(150deg,var(--chem-dk),var(--eng-dk)); color:#fff; border-radius:var(--radius); padding:18px; text-align:center; }
.quote-card .leaf{ font-size:24px; }
.quote-card p{ font-size:13.5px; margin:8px 0 12px; line-height:1.9; }
.quote-card button{ background:rgba(255,255,255,.18); color:#fff; padding:9px 14px; border-radius:999px; font-size:12.5px; font-weight:700; }
.continue-card{ display:flex; align-items:center; gap:12px; }
.continue-card .thumb{ width:64px;height:64px;border-radius:12px; background:var(--accent-lt); color:var(--accent); display:flex;align-items:center;justify-content:center; font-size:22px; flex:none; }
.continue-card .info{ min-width:0; }
.continue-card .info .lbl{ font-size:11px; color:var(--ink-dim); }
.continue-card .info .ttl{ font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.continue-card a.go{ margin-inline-start:auto; background:var(--accent); color:#fff; font-size:12px; font-weight:700; padding:8px 12px; border-radius:999px; flex:none; }

.section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.section-head a.viewall{ font-size:13px; font-weight:700; color:var(--ink-dim); display:flex; align-items:center; gap:5px; }
.vgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:26px; }
.vcard{ background:var(--card); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
.vcard .thumb{ position:relative; aspect-ratio:16/10; background-size:cover; background-position:center; }
.vcard .badge{ position:absolute; top:10px; right:10px; background:rgba(0,0,0,.55); color:#fff; font-size:11px; padding:4px 10px; border-radius:999px; }
.vcard .play{ position:absolute; inset:0; margin:auto; width:42px;height:42px; border-radius:50%; background:rgba(255,255,255,.92); display:flex;align-items:center;justify-content:center; color:#111; }
.vcard .body{ padding:13px 14px 15px; }
.vcard .body h4{ font-size:14px; margin-bottom:4px; }
.vcard .body .sub{ font-size:12px; color:var(--ink-dim); margin-bottom:10px; }
.vcard .row{ display:flex; gap:8px; }
.vcard .row button, .vcard .row a{ flex:1; text-align:center; font-size:12px; font-weight:700; padding:9px 6px; border-radius:10px; }
.btn-solid{ background:var(--accent); color:#fff; }
.btn-outline{ background:var(--accent-lt); color:var(--accent-dk); }

.features{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px 26px; }
.features h2{ font-size:19px; margin-bottom:16px; }
.fgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px 14px; }
.fitem{ display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; }
.fitem .fi{ width:46px;height:46px;border-radius:14px; background:var(--bg); display:flex;align-items:center;justify-content:center; color:var(--accent); }
.fitem span{ font-size:12.5px; font-weight:700; color:var(--ink-dim); }
footer.pagefoot{ display:flex; justify-content:space-between; align-items:center; margin-top:26px; font-size:12px; color:var(--ink-dim); padding-top:14px; border-top:1px solid var(--line); }

.section-hero{ border-radius:var(--radius); padding:30px; margin-bottom:24px; color:#fff; display:flex; align-items:center; gap:22px; background:linear-gradient(120deg,var(--accent-dk),var(--accent)); }
.section-hero .emoji{ width:78px;height:78px;border-radius:22px; background:rgba(255,255,255,.18); display:flex;align-items:center;justify-content:center; font-size:36px; flex:none; }
.section-hero h1{ color:#fff; font-size:25px; }
.section-hero .en{ opacity:.85; font-size:13px; margin-bottom:6px; }
.section-hero .stats{ display:flex; gap:22px; margin-top:12px; }
.section-hero .stats div b{ display:block; font-size:18px; }
.section-hero .stats div span{ font-size:11.5px; opacity:.85; }
.section-hero .overall{ margin-inline-start:auto; text-align:center; }
.ring{ width:84px;height:84px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:16px; background:conic-gradient(#fff var(--p,0%), rgba(255,255,255,.25) 0); }
.ring .in{ width:66px;height:66px; border-radius:50%; background:var(--accent-dk); display:flex; align-items:center; justify-content:center; }

.unit{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:18px; overflow:hidden; }
.unit-head{ display:flex; align-items:center; gap:12px; padding:18px 20px; cursor:pointer; user-select:none; }
.unit-head .num{ width:38px;height:38px; border-radius:11px; background:var(--accent-lt); color:var(--accent-dk); display:flex;align-items:center;justify-content:center; font-weight:700; flex:none; }
.unit-head h3{ font-size:16px; }
.unit-head .meta{ font-size:12px; color:var(--ink-dim); }
.unit-head .chev{ margin-inline-start:auto; transition:transform .2s ease; color:var(--ink-dim); }
.unit.open .chev{ transform:rotate(180deg); }
.unit-body{ display:none; padding:0 20px 20px; }
.unit.open .unit-body{ display:block; }
.unit-progress{ padding:0 20px 14px; display:flex; align-items:center; gap:10px; font-size:12px; color:var(--ink-dim); }
.unit-progress .pbar{ height:7px; }
.lesson{ display:flex; gap:14px; padding:16px 0; border-top:1px solid var(--line); }
.lesson:first-child{ border-top:none; }
.lesson .vbox video{ width:230px; border-radius:12px; background:#000; aspect-ratio:16/9; object-fit:cover; }
.lesson .vbox .novideo{ width:230px;aspect-ratio:16/9; border-radius:12px; background:var(--accent-lt); color:var(--accent-dk); display:flex;flex-direction:column;align-items:center;justify-content:center; font-size:12px; text-align:center; gap:6px; padding:10px; }
.lesson .info{ flex:1; min-width:0; }
.lesson .info h4{ font-size:15px; margin-bottom:6px; display:flex; align-items:center; gap:8px; }
.lesson .info .summary{ font-size:13px; color:var(--ink-dim); line-height:1.9; margin-bottom:10px; }
.lesson .actions{ display:flex; gap:8px; flex-wrap:wrap; }
.lesson .actions a, .lesson .actions button{ font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:10px; display:flex; align-items:center; gap:6px; }
.fav-btn{ background:none; color:var(--ink-dim); border:1px solid var(--line) !important; }
.fav-btn.active{ color:#EF4444; border-color:#EF4444 !important; }
.done-btn{ background:var(--bg); color:var(--ink-dim); border:1px solid var(--line) !important; }
.done-btn.active{ background:#16A34A; color:#fff; border-color:#16A34A !important; }
.quiz-box{ background:var(--accent-lt); border-radius:var(--radius-sm); padding:16px 18px; display:flex; align-items:center; gap:14px; margin-top:4px; }
.quiz-box .qi{ width:44px;height:44px;border-radius:12px; background:var(--accent); color:#fff; display:flex;align-items:center;justify-content:center; flex:none; }
.quiz-box .qt{ flex:1; }
.quiz-box .qt h4{ font-size:14px; }
.quiz-box .qt p{ margin:2px 0 0; font-size:12px; color:var(--ink-dim); }
.quiz-box a.go, .quiz-box button.go{ background:var(--accent); color:#fff; padding:10px 18px; border-radius:10px; font-size:13px; font-weight:700; white-space:nowrap; }
.quiz-frame-wrap{ margin-top:14px; border-radius:12px; overflow:hidden; border:1px solid var(--line); display:none; }
.quiz-frame-wrap.show{ display:block; }
.quiz-frame-wrap iframe{ width:100%; height:520px; border:none; display:block; }

.pagehead{ margin-bottom:20px; }
.pagehead p{ color:var(--ink-dim); font-size:13.5px; margin-top:6px; }
.simple-card{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; margin-bottom:16px; }
.timetable{ display:grid; grid-template-columns:70px repeat(7,1fr); gap:6px; }
.timetable .cell{ background:var(--bg); border-radius:10px; min-height:56px; padding:6px; font-size:11px; }
.timetable .head{ text-align:center; font-weight:700; font-size:12.5px; background:none; }
.timetable .time{ display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--ink-dim); background:none; }
.timetable .slot{ border-radius:8px; padding:5px 6px; color:#fff; font-size:10.5px; font-weight:700; line-height:1.4; }
.notes-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.note{ background:#FFF7D6; border-radius:14px; padding:14px; min-height:140px; box-shadow:var(--shadow); position:relative; }
[data-theme="dark"] .note{ background:#3A3320; }
.note textarea{ width:100%; height:90px; background:none; border:none; resize:none; font-family:inherit; font-size:13px; color:var(--ink); }
.note textarea:focus{ outline:none; }
.note .del{ position:absolute; top:8px; left:10px; background:none; color:var(--ink-dim); font-size:16px; }
.add-note{ border:2px dashed var(--line); border-radius:14px; min-height:140px; display:flex;align-items:center;justify-content:center; flex-direction:column; gap:6px; color:var(--ink-dim); font-weight:700; font-size:13px; background:none; }
.prog-row{ display:flex; align-items:center; gap:14px; padding:14px 0; border-top:1px solid var(--line); }
.prog-row:first-child{ border-top:none; }
.prog-row .ic{ width:44px;height:44px; border-radius:12px; display:flex;align-items:center;justify-content:center; color:#fff; flex:none; }
.prog-row .name{ width:120px; font-weight:700; font-size:14px; flex:none; }
.prog-row .pbar{ height:9px; }
.prog-row .pct{ width:44px; text-align:left; font-weight:700; font-size:13px; }
.fav-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
.fav-item{ display:flex; align-items:center; gap:12px; background:var(--card); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow); }
.fav-item .ic{ width:40px;height:40px;border-radius:11px; display:flex;align-items:center;justify-content:center; color:#fff; flex:none; }
.fav-item .t{ flex:1; min-width:0; }
.fav-item .t .s{ font-size:11px; color:var(--ink-dim); }
.fav-item .t .n{ font-weight:700; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.setting-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-top:1px solid var(--line); }
.setting-row:first-child{ border-top:none; }
.setting-row .t b{ display:block; font-size:14px; }
.setting-row .t span{ font-size:12px; color:var(--ink-dim); }
.switch{ width:46px; height:26px; border-radius:99px; background:var(--line); position:relative; flex:none; }
.switch::after{ content:""; position:absolute; top:3px; right:3px; width:20px;height:20px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3); }
.switch.on{ background:var(--accent); }
.switch.on::after{ right:23px; }
.pomo-widget{ text-align:center; }
.pomo-time{ font-family:'El Messiri',serif; font-size:38px; font-weight:700; margin:8px 0; }
.pomo-controls{ display:flex; gap:8px; justify-content:center; }
.pomo-controls button{ background:var(--accent); color:#fff; padding:9px 16px; border-radius:10px; font-size:12.5px; font-weight:700; }
.pomo-controls button.alt{ background:var(--bg); color:var(--ink); }
#toast{ position:fixed; bottom:22px; right:50%; transform:translateX(50%); background:var(--ink); color:var(--bg-soft); padding:11px 22px; border-radius:999px; font-size:13px; font-weight:700; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:999; }
#toast.show{ opacity:1; transform:translateX(50%) translateY(-6px); }

@media (max-width:980px){
  .app{ grid-template-columns:1fr; }
  .sidebar{ position:fixed; z-index:50; inset-inline-start:0; top:0; height:100vh; transform:translateX(102%); transition:transform .25s ease; width:250px; }
  .sidebar.show{ transform:translateX(0); }
  .content-grid{ grid-template-columns:1fr; }
  .cards4, .vgrid, .fgrid{ grid-template-columns:repeat(2,1fr); }
  .notes-grid{ grid-template-columns:repeat(2,1fr); }
  .fav-grid{ grid-template-columns:1fr; }
  .menu-toggle{ display:flex !important; }
  .lesson{ flex-direction:column; }
  .lesson .vbox video, .lesson .vbox .novideo{ width:100%; }
}
.menu-toggle{ display:none; }
@media (max-width:640px){
  .cards4, .vgrid, .fgrid, .notes-grid{ grid-template-columns:1fr; }
  .section-hero{ flex-direction:column; text-align:center; }
  .section-hero .overall{ margin-inline-start:0; }
  .timetable{ font-size:10px; }
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div id="page-content"></div>
  </div>
</div>
<div id="toast"></div>

<script>
/* =========================================================================
   MyStudy — ملف واحد يضم كل شيء (HTML + CSS + JS) وموجّه صفحات داخلي (SPA)
   لتعديل المحتوى (فيديو/ملف/كويز) عدّل كائن SECTION_DATA_ALL بالأسفل.
   ========================================================================= */

/* derived indexes used by home/favorites/quizzes/progress views */
const UNIT_TITLES = {};
const LESSON_TITLES = {};
const DATA_SUMMARY = {};
Object.values(SECTION_DATA_ALL).forEach(D=>{
  UNIT_TITLES[D.key] = {};
  let lessons=0;
  D.units.forEach(u=>{
    UNIT_TITLES[D.key][u.id] = u.title;
    u.lessons.forEach(l=>{ LESSON_TITLES[D.key+':'+u.id+':'+l.id] = l.title; lessons++; });
  });
  DATA_SUMMARY[D.key] = { units:D.units.length, lessons, quizzes:D.units.length };
});

/* ---------------- Progress helpers ---------------- */
function sectionProgress(key){
  const done = Store.get('ms_done', {});
  const quiz = Store.get('ms_quiz', {});
  const total = DATA_SUMMARY[key].lessons + DATA_SUMMARY[key].quizzes;
  let got = 0;
  Object.keys(done).forEach(k=>{ if(k.startsWith(key+':') && done[k]) got++; });
  Object.keys(quiz).forEach(k=>{ if(k.startsWith(key+':') && quiz[k]) got++; });
  return Math.min(100, Math.round((got/total)*100));
}
function overallProgress(){
  const keys = Object.keys(SECTIONS);
  return Math.round(keys.reduce((a,k)=>a+sectionProgress(k),0)/keys.length);
}

function renderSectionPage(key, unitId){
  const D = SECTION_DATA_ALL[key];
  document.body.setAttribute('data-section', key);

  const done = Store.get('ms_done', {});
  const quiz = Store.get('ms_quiz', {});
  const totalLessons = D.units.reduce((a,u)=>a+u.lessons.length,0);
  const totalQuiz = D.units.length;
  let gotL=0, gotQ=0;
  D.units.forEach(u=>{ u.lessons.forEach(l=>{ if(done[key+':'+u.id+':'+l.id]) gotL++; }); if(quiz[key+':'+u.id]) gotQ++; });
  const pct = Math.round(((gotL+gotQ)/(totalLessons+totalQuiz))*100) || 0;

  const heroHtml = `
  <div class="section-hero">
    <div class="emoji">${icon(D.icon)}</div>
    <div><div class="en">${D.en}</div><h1>${D.title}</h1><p style="opacity:.9;font-size:13px;margin-top:4px">${D.tagline}</p>
      <div class="stats"><div><b>${D.units.length}</b><span>وحدات</span></div><div><b>${totalLessons}</b><span>دروس</span></div><div><b>${totalQuiz}</b><span>كويزات</span></div></div>
    </div>
    <div class="overall"><div class="ring" style="--p:${pct}%"><div class="in">${pct}%</div></div><div style="font-size:11px;margin-top:6px;opacity:.9">تقدمك بالقسم</div></div>
  </div>`;

  const unitsHtml = D.units.map((u,idx)=>{
    const doneCount = u.lessons.filter(l=>done[key+':'+u.id+':'+l.id]).length;
    const qDone = quiz[key+':'+u.id];
    const unitPct = Math.min(100, Math.round((doneCount/(u.lessons.length+1))*100) + (qDone ? Math.round(100/(u.lessons.length+1)) : 0));
    const lessonsHtml = u.lessons.map(l=>{
      const lkey = `${key}:${u.id}:${l.id}`;
      const isFav = Store.get('ms_fav', {})[lkey];
      const isDone = done[lkey];
      return `
      <div class="lesson">
        <div class="vbox">${l.video
          ? `<video controls data-key="${lkey}" data-section="${key}" data-title="${l.title}" src="${l.video}"></video>`
          : `<div class="novideo">${icon('play')}<span>ضع رابط الفيديو من جهازك هنا<br>(${l.videoHint})</span></div>`}</div>
        <div class="info">
          <h4>${l.title}</h4>
          <div class="summary">${l.summary}</div>
          <div class="actions">
            <a class="btn-outline" href="${l.file}" download>${icon('download')} تحميل ملف الشرح</a>
            <button class="fav-btn ${isFav?'active':''}" data-key="${lkey}">${icon('heart')} ${isFav?'في المفضلة':'أضف للمفضلة'}</button>
            <button class="done-btn ${isDone?'active':''}" data-key="${lkey}">${isDone? icon('check')+' مكتمل':'وضع علامة: مكتمل'}</button>
          </div>
        </div>
      </div>`;
    }).join('');

    return `
    <div class="unit" id="unit-${u.id}">
      <div class="unit-head">
        <div class="num">${idx+1}</div>
        <div><h3>${u.title}</h3><div class="meta">${u.lessons.length} دروس + كويز الوحدة</div></div>
        <div class="chev">${icon('arrow')}</div>
      </div>
      <div class="unit-progress"><span>${unitPct}%</span><div class="pbar"><span style="width:${unitPct}%"></span></div></div>
      <div class="unit-body">
        ${lessonsHtml}
        <div class="quiz-box">
          <div class="qi">${icon('quiz')}</div>
          <div class="qt"><h4>كويز: ${u.title}</h4><p>اختبر فهمك للوحدة عبر النموذج التفاعلي بدون مغادرة الموقع</p></div>

  document.getElementById('page-content').innerHTML = heroHtml + `<div id="unitsWrap">${unitsHtml}</div>`;

function wireSectionEvents(key, D, unitId){
  document.querySelectorAll('.unit-head').forEach(h=> h.addEventListener('click', ()=> h.closest('.unit').classList.toggle('open')));

  document.querySelectorAll('.fav-btn').forEach(b=>{
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      const k = b.dataset.key;
      const fav = Store.get('ms_fav', {});
      fav[k] = !fav[k]; Store.set('ms_fav', fav);
      b.classList.toggle('active');
      b.innerHTML = icon('heart')+' '+(fav[k] ? 'في المفضلة':'أضف للمفضلة');
      toast(fav[k] ? 'أُضيف إلى المفضلة ❤️' : 'أُزيل من المفضلة');
    });
  });

  document.querySelectorAll('.done-btn:not(.quiz-done)').forEach(b=>{
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      const k = b.dataset.key;
      const done = Store.get('ms_done', {});
      done[k] = !done[k]; Store.set('ms_done', done);
      b.classList.toggle('active');
      b.innerHTML = done[k] ? icon('check')+' مكتمل' : 'وضع علامة: مكتمل';
      toast(done[k] ? 'أحسنت! تم إنجاز الدرس 🎉' : 'تم إلغاء علامة الإنجاز');
      renderSectionPage(key, unitId);
    });
  });

  document.querySelectorAll('.quiz-toggle').forEach(b=>{
    b.addEventListener('click', ()=>{
      const frame = document.getElementById('frame-'+b.dataset.unit);
      frame.classList.toggle('show');
      if(frame.classList.contains('show') && !frame.dataset.loaded){
        frame.querySelector('iframe').src = b.dataset.form;
        frame.dataset.loaded = '1';
      }
    });
  });

  document.querySelectorAll('.quiz-done').forEach(b=>{
    b.addEventListener('click', ()=>{
      const k = b.dataset.key;
      const q = Store.get('ms_quiz', {});
      q[k] = !q[k]; Store.set('ms_quiz', q);
      toast(q[k] ? 'أحسنت! تم تسجيل إنجاز الكويز 🎉' : 'تم إلغاء علامة الإنجاز');
      renderSectionPage(key, unitId);
    });
  });

  document.querySelectorAll('video[data-key]').forEach(v=>{
    const k = v.dataset.key;
    const pos = Store.get('ms_video_pos', {});
    if(pos[k]) v.currentTime = pos[k];
    v.addEventListener('timeupdate', ()=>{ const p=Store.get('ms_video_pos',{}); p[k]=v.currentTime; Store.set('ms_video_pos',p); });
    v.addEventListener('play', ()=> Store.set('ms_lastlesson', { section: v.dataset.section, title: v.dataset.title }));
  });

  const target = unitId && document.getElementById('unit-'+unitId);
  if(target){ target.classList.add('open'); setTimeout(()=> target.scrollIntoView({behavior:'smooth', block:'start'}), 150); }
  else { const first = document.querySelector('.unit'); if(first) first.classList.add('open'); }
}

  TIMES.forEach((t,ti)=>{
    tt += `<div class="cell time">${t}</div>`;
    DAYS.forEach((d,di)=>{
      const item = PLAN[ti][di];
      if(item){
        const varName = {chemistry:'chem',english:'eng',communication:'comm',medical:'med'}[item.sec];
        tt += `<div class="cell" style="padding:4px"><div class="slot" style="background:var(--${varName})">${item.l}</div></div>`;
      } else tt += `<div class="cell"></div>`;
    });
  });

  document.getElementById('page-content').innerHTML = `
    <div class="pagehead"><h1>جدولي الدراسي</h1><p>نظّم أسبوعك الدراسي بحيث تخصص وقتاً لكل مادة، والتزم بالتوقيت قدر الإمكان.</p></div>
    <div class="simple-card"><h3 style="margin-bottom:14px">الخطة الأسبوعية</h3><div class="timetable">${tt}</div></div>
    <div class="simple-card" id="pomodoro" style="max-width:360px">
      <h3 style="margin-bottom:6px">مؤقت بومودورو</h3>
      <p style="color:var(--ink-dim);font-size:12.5px;margin-bottom:10px">25 دقيقة تركيز، ثم 5 دقائق راحة — كرر الدورة لزيادة إنتاجيتك.</p>
      <div class="pomo-widget">
        <div id="pomoLabel" style="font-size:12.5px;color:var(--ink-dim)">وقت التركيز</div>
        <div class="pomo-time" id="pomoTime">25:00</div>
        <div class="pomo-controls"><button id="pomoStart">ابدأ</button><button class="alt" id="pomoReset">إعادة ضبط</button></div>
      </div>
    </div>`;

  pomoRender();
  document.getElementById('pomoStart').addEventListener('click', (e)=>{
    pomoRunning = !pomoRunning;
    e.target.textContent = pomoRunning ? 'إيقاف مؤقت' : 'ابدأ';
    if(pomoRunning){
      pomoInterval = setInterval(()=>{
        pomoSeconds--;
        if(pomoSeconds<0){ pomoFocus=!pomoFocus; pomoSeconds = pomoFocus?25*60:5*60; toast(pomoFocus?'انتهت الراحة! ارجع للتركيز 💪':'وقت راحة قصيرة ☕'); }
        pomoRender();
      }, 1000);
    } else clearInterval(pomoInterval);
  });
  document.getElementById('pomoReset').addEventListener('click', ()=>{
    clearInterval(pomoInterval); pomoRunning=false; pomoFocus=true; pomoSeconds=25*60;
    document.getElementById('pomoStart').textContent='ابدأ'; pomoRender();
  });
  if(openPomo){ setTimeout(()=> document.getElementById('pomodoro').scrollIntoView({behavior:'smooth'}), 100); }
}
function pomoRender(){
  const m = String(Math.floor(pomoSeconds/60)).padStart(2,'0');
  const s = String(pomoSeconds%60).padStart(2,'0');
  document.getElementById('pomoTime').textContent = `${m}:${s}`;
  document.getElementById('pomoLabel').textContent = pomoFocus ? 'وقت التركيز' : 'وقت الراحة';
}

/* ================= PROGRESS ================= */
function renderProgressPage(){
  document.body.removeAttribute('data-section');
  const overall = overallProgress();
  const rows = Object.entries(SECTIONS).map(([key,s])=>{
    const p = sectionProgress(key);
    return `<div class="prog-row"><div class="ic" style="background:${s.color}">${icon(s.icon)}</div><div class="name">${s.title}</div>
      <div class="pbar" style="flex:1"><span style="width:${p}%;background:${s.color}"></span></div><div class="pct">${p}%</div></div>`;
  }).join('');
  document.getElementById('page-content').innerHTML = `
    <div class="pagehead"><h1>متابعة التقدم</h1><p>تابع نسبة إنجازك في كل مادة، واستمر حتى تصل لـ 100% في الجميع.</p></div>
    <div class="simple-card"><div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
      <div class="ring" style="width:110px;height:110px;background:conic-gradient(var(--chem) ${overall}%, var(--line) 0)">
        <div class="in" style="width:88px;height:88px;background:var(--bg-soft);color:var(--ink)">${overall}%</div>
      </div>
      <div><h3>تقدمك العام</h3><p style="color:var(--ink-dim);font-size:13px;margin-top:4px">هذه النسبة تجمع تقدمك في جميع الأقسام الأربعة</p></div>
    </div></div>
    <div class="simple-card"><h3 style="margin-bottom:6px">التقدم حسب المادة</h3>${rows}</div>`;
}

/* ================= QUIZZES ================= */
function renderQuizzesPage(){
  document.body.removeAttribute('data-section');
  const quizDone = Store.get('ms_quiz', {});
  let html = '';
  Object.entries(SECTIONS).forEach(([key,s])=>{
    html += `<h3 style="margin:18px 0 10px;color:${s.color}">${s.title}</h3>`;
    Object.entries(UNIT_TITLES[key]).forEach(([uid,utitle])=>{
      const d = quizDone[key+':'+uid];
      html += `<div class="quiz-box" style="background:var(--bg);margin-bottom:10px">
        <div class="qi" style="background:${s.color}">${icon('quiz')}</div>
        <div class="qt"><h4>${utitle}</h4><p>${d?'تم إنجاز هذا الكويز ✅':'لم يُنجز بعد'}</p></div>
        <a class="go" href="#/${key}/${uid}" style="background:${s.color}">فتح الكويز</a>
      </div>`;
    });
  });
  document.getElementById('page-content').innerHTML = `
    <div class="pagehead"><h1>الكويزات</h1><p>كل كويزات الوحدات في مكان واحد — افتح أي كويز من داخل قسمه مباشرة.</p></div>
    <div class="simple-card">${html}</div>`;
}

/* ================= FAVORITES ================= */
function renderFavoritesPage(){
  document.body.removeAttribute('data-section');
  const fav = Store.get('ms_fav', {});
  const keys = Object.keys(fav).filter(k=>fav[k]);
  let body;
  if(!keys.length){
    body = `<div class="simple-card" style="text-align:center;color:var(--ink-dim)">${icon('heart')}<p style="margin-top:10px">لا توجد دروس في المفضلة بعد — اضغط "أضف للمفضلة" داخل أي درس.</p></div>`;
  } else {
    body = `<div class="fav-grid">` + keys.map(k=>{
      const [sec, uid] = k.split(':');
      const s = SECTIONS[sec];
      return `<a class="fav-item" href="#/${sec}/${uid}">
        <div class="ic" style="background:${s.color}">${icon(s.icon)}</div>
        <div class="t"><div class="s">${s.title}</div><div class="n">${LESSON_TITLES[k]||k}</div></div>
        ${icon('arrow')}</a>`;
    }).join('') + `</div>`;
  }
  document.getElementById('page-content').innerHTML = `
    <div class="pagehead"><h1>المفضلة</h1><p>الدروس التي حفظتها لمراجعتها لاحقاً بسهولة.</p></div>${body}`;
}

/* ================= NOTES ================= */
function renderNotesPage(){
  document.body.removeAttribute('data-section');
  document.getElementById('page-content').innerHTML = `
    <div class="pagehead"><h1>الملاحظات</h1><p>دوّن أي فكرة أو ملاحظة سريعة أثناء المذاكرة — تُحفظ تلقائياً في متصفحك.</p></div>
    <div class="notes-grid" id="notesGrid"></div>`;
  renderNotesGrid();
}
function renderNotesGrid(){
  const notes = Store.get('ms_notes', []);
  const grid = document.getElementById('notesGrid');
  grid.innerHTML = notes.map(n=>`
    <div class="note" data-id="${n.id}"><textarea placeholder="اكتب ملاحظتك هنا...">${n.text}</textarea><button class="del" aria-label="حذف">✕</button></div>
  `).join('') + `<button class="add-note" id="addNote">+ ملاحظة جديدة</button>`;

  grid.querySelectorAll('.note textarea').forEach(ta=>{
    ta.addEventListener('input', ()=>{
      const id = ta.closest('.note').dataset.id;
      const list = Store.get('ms_notes', []);
      const n = list.find(x=>String(x.id)===id);
      if(n){ n.text = ta.value; Store.set('ms_notes', list); }
    });
  });
  grid.querySelectorAll('.note .del').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.closest('.note').dataset.id;
      Store.set('ms_notes', Store.get('ms_notes', []).filter(x=>String(x.id)!==id));
      renderNotesGrid(); toast('تم حذف الملاحظة');
    });
  });
  document.getElementById('addNote').addEventListener('click', ()=>{
    const list = Store.get('ms_notes', []);
    list.push({ id: Date.now(), text:'' });
    Store.set('ms_notes', list);
    renderNotesGrid();
    const areas = grid.querySelectorAll('textarea');
    if(areas.length) areas[areas.length-1].focus();
  });
}

/* ================= SETTINGS ================= */
function renderSettingsPage(){
  document.body.removeAttribute('data-section');
  document.getElementById('page-content').innerHTML = `
    <div class="pagehead"><h1>الإعدادات</h1><p>خصّص تجربتك داخل الموقع.</p></div>
    <div class="simple-card">
      <div class="setting-row"><div class="t"><b>الوضع الليلي</b><span>مريح أكثر للعين أثناء المذاكرة الليلية</span></div><div class="switch" id="darkSwitch"></div></div>
      <div class="setting-row"><div class="t"><b>تذكيرات المذاكرة</b><span>تنبيه بمواعيد جدولك الدراسي (تجريبي)</span></div><div class="switch" id="remindSwitch"></div></div>
    </div>
    <div class="simple-card"><div class="setting-row"><div class="t"><b>إعادة ضبط التقدم</b><span>يمسح كل علامات الإنجاز، المفضلة، والملاحظات</span></div>
      <button id="resetBtn" style="background:#EF4444;color:#fff;padding:9px 16px;border-radius:10px;font-weight:700;font-size:13px">إعادة ضبط</button></div></div>
    <div class="simple-card" style="text-align:center;color:var(--ink-dim);font-size:12.5px">MyStudy © 2026 — صُنع لمساعدتك على التفوق 💜</div>`;

  const darkSwitch = document.getElementById('darkSwitch');
  if(Store.get('ms_theme','light')==='dark') darkSwitch.classList.add('on');
  darkSwitch.addEventListener('click', ()=>{ toggleTheme(); darkSwitch.classList.toggle('on'); });

  const remindSwitch = document.getElementById('remindSwitch');
  if(Store.get('ms_reminders','off')==='on') remindSwitch.classList.add('on');
  remindSwitch.addEventListener('click', ()=>{
    const now = Store.get('ms_reminders','off')==='on' ? 'off' : 'on';
    Store.set('ms_reminders', now); remindSwitch.classList.toggle('on');
    toast(now==='on' ? 'تم تفعيل التذكيرات' : 'تم إيقاف التذكيرات');
  });

  document.getElementById('resetBtn').addEventListener('click', ()=>{
    if(confirm('هل أنت متأكد من إعادة ضبط كل تقدمك؟ لا يمكن التراجع عن هذا الإجراء.')){
      ['ms_done','ms_quiz','ms_fav','ms_notes','ms_lastlesson','ms_video_pos'].forEach(k=>localStorage.removeItem(k));
      toast('تم إعادة ضبط التقدم بنجاح');
      setTimeout(()=> go(''), 900);
    }
  });
}

/* ================= ROUTER ================= */
function router(){
  document.getElementById('sidebar').classList.remove('show');
  const hash = location.hash.replace(/^#\/?/, '');
  const parts = hash.split('/').filter(Boolean);
  const route = parts[0] || '';

  renderTopbar();

  if(route === '' ){ renderSidebar('home'); renderHome(false); }
  else if(route === 'sections'){ renderSidebar('sections'); renderHome(true); }
  else if(SECTIONS[route]){ renderSidebar('sections'); renderSectionPage(route, parts[1]); }
  else if(route === 'schedule'){ renderSidebar('schedule'); renderSchedule(parts[1]==='pomodoro'); }
  else if(route === 'progress'){ renderSidebar('progress'); renderProgressPage(); }
  else if(route === 'quizzes'){ renderSidebar('quizzes'); renderQuizzesPage(); }
  else if(route === 'favorites'){ renderSidebar('favorites'); renderFavoritesPage(); }
  else if(route === 'notes'){ renderSidebar('notes'); renderNotesPage(); }
  else if(route === 'settings'){ renderSidebar('settings'); renderSettingsPage(); }
  else { renderSidebar('home'); renderHome(false); }

  window.scrollTo(0,0);
}

applyTheme();
window.addEventListener('hashchange', router);
document.addEventListener('DOMContentLoaded', router);
</script>
