<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متابعة التقدم — MyStudy</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="page-content">
  <div class="pagehead">
    <h1>متابعة التقدم</h1>
    <p>تابع نسبة إنجازك في كل مادة، واستمر حتى تصل لـ 100% في الجميع.</p>
  </div>

  <div class="simple-card">
    <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
      <div class="ring" style="--p:0%;width:110px;height:110px;background:conic-gradient(var(--chem) var(--p,0%), var(--line) 0)" id="overallRing">
        <div class="in" style="width:88px;height:88px;background:var(--bg-soft);color:var(--ink)" id="overallPct">0%</div>
      </div>
      <div>
        <h3>تقدمك العام</h3>
        <p style="color:var(--ink-dim);font-size:13px;margin-top:4px">هذه النسبة تجمع تقدمك في جميع الأقسام الأربعة</p>
      </div>
    </div>
  </div>

  <div class="simple-card" id="perSection"></div>
</div>

<script src="assets/app.js"></script>
<script src="assets/progress.js"></script>
</body>
</html>
